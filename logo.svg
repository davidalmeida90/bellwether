<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="960" height="240" role="img" aria-label="Bellwether">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2545"/>
      <stop offset="1" stop-color="#132033"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2A4E7E"/>
      <stop offset="1" stop-color="#6590B8"/>
    </linearGradient>
  </defs>

  <rect width="960" height="240" fill="url(#sky)"/>

  <!-- mark: a bell whose clapper is the rising line the boards measure -->
  <g transform="translate(64 48)">
    <rect x="0" y="0" width="144" height="144" rx="34" fill="#0E1726" stroke="#24344D" stroke-width="2"/>
    <g transform="translate(30 26)">
      <path d="M42 6c-14 0-25 11-25 25 0 26-9 33-13 38h76c-4-5-13-12-13-38C67 17 56 6 42 6Z"
            fill="none" stroke="#8DA9C4" stroke-width="5" stroke-linejoin="round"/>
      <path d="M33 78a9 9 0 0 0 18 0" fill="none" stroke="#8DA9C4" stroke-width="5" stroke-linecap="round"/>
      <polyline points="24,56 36,44 48,50 62,30" fill="none" stroke="#4C7FB8"
                stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="62" cy="30" r="5.5" fill="#6590B8"/>
    </g>
  </g>

  <!-- bars: the daily boards, stacked -->
  <g transform="translate(236 154)">
    <rect x="0" y="-18" width="8" height="18" rx="3" fill="url(#bar)" opacity=".55"/>
    <rect x="14" y="-30" width="8" height="30" rx="3" fill="url(#bar)" opacity=".7"/>
    <rect x="28" y="-46" width="8" height="46" rx="3" fill="url(#bar)"/>
  </g>

  <text x="236" y="120" font-family="'IBM Plex Sans','Segoe UI',system-ui,sans-serif"
        font-size="74" font-weight="700" fill="#E6EDF6" letter-spacing="-1.5">Bellwether</text>
  <text x="290" y="160" font-family="'IBM Plex Mono','SFMono-Regular',monospace"
        font-size="21" fill="#8DA9C4" letter-spacing=".5">the GitHub trending board, tracked every day</text>
</svg>
